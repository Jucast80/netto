<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none';">
    <title>Pago por Bizum · Netto App®</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --surface: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-soft: #d1fae5;
            --danger: #ef4444;
            --danger-soft: #fee2e2;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 16px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            padding: 22px 20px;
            margin: auto 0;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 10px;
        }
        .brand {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: -0.6px;
            color: var(--text);
        }
        .brand span {
            color: var(--primary);
        }
        .lang-toggle {
            display: inline-flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px;
            gap: 2px;
        }
        .lang-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 999px;
            cursor: pointer;
        }
        .lang-btn.active {
            background: var(--text);
            color: #ffffff;
        }
        .merchant-name {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--muted);
            margin: 4px 0 4px;
            word-break: break-word;
        }
        .amount-hero {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--text);
            margin: 0 0 18px;
        }
        .data-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .data-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .data-row:last-child {
            padding-bottom: 0;
            border-bottom: 0;
        }
        .data-info {
            min-width: 0;
            flex: 1;
        }
        .data-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .data-value {
            display: block;
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            word-break: break-word;
        }
        .copy-icon-btn {
            appearance: none;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #ffffff;
            color: var(--muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.08s ease;
        }
        .copy-icon-btn:hover {
            background: var(--surface);
            color: var(--text);
            border-color: #cbd5e1;
        }
        .copy-icon-btn:active {
            transform: scale(0.92);
        }
        .copy-icon-btn .icon-check {
            display: none;
        }
        .copy-icon-btn .icon-copy {
            display: block;
        }
        .copy-icon-btn.copied {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }
        .copy-icon-btn.copied .icon-copy {
            display: none;
        }
        .copy-icon-btn.copied .icon-check {
            display: block;
        }
        .primary-cta {
            appearance: none;
            width: 100%;
            border: 0;
            background: var(--primary);
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            padding: 15px 18px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
            transition: transform 0.1s ease, background-color 0.15s ease;
            margin-top: 14px;
            margin-bottom: 0;
        }
        .primary-cta:active {
            transform: scale(0.985);
            background: var(--primary-dark);
        }
        .primary-cta.copied {
            background: var(--primary-dark);
        }
        .status-banner {
            display: none;
            background: var(--primary-soft);
            border: 1px solid #6ee7b7;
            color: #065f46;
            border-radius: 14px;
            padding: 13px 15px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.45;
            margin-top: 12px;
        }
        .status-banner.visible {
            display: block;
        }
        .error-box {
            display: none;
            text-align: center;
            padding: 20px 10px;
        }
        .error-icon {
            width: 52px;
            height: 52px;
            border-radius: 999px;
            background: var(--danger-soft);
            color: var(--danger);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 12px;
        }
        .error-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0 0 8px;
            color: var(--text);
        }
        .error-desc {
            font-size: 13.5px;
            color: var(--muted);
            line-height: 1.5;
            margin: 0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="topbar">
            <div class="brand">Netto App<span>®</span></div>
            <div class="lang-toggle" role="group" aria-label="Language">
                <button type="button" class="lang-btn" id="btn-lang-es">ES</button>
                <button type="button" class="lang-btn" id="btn-lang-en">EN</button>
            </div>
        </div>

        <section id="payment-view">
            <p class="merchant-name" id="merchant-name">Netto App®</p>
            <h1 class="amount-hero" id="amount-hero">0,00 €</h1>

            <div class="data-box">
                <div class="data-row">
                    <div class="data-info">
                        <span class="data-label" id="lbl-phone">Teléfono Bizum</span>
                        <span class="data-value" id="val-phone">+34 --- -- -- --</span>
                    </div>
                </div>

                <div class="data-row">
                    <div class="data-info">
                        <span class="data-label" id="lbl-amount">Importe</span>
                        <span class="data-value" id="val-amount">0,00 €</span>
                    </div>
                    <button type="button" class="copy-icon-btn" id="copy-amount-btn" aria-label="Copiar importe" title="Copiar importe">
                        <svg class="icon-copy" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <svg class="icon-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </button>
                </div>

                <div class="data-row" id="concept-row">
                    <div class="data-info">
                        <span class="data-label" id="lbl-concept">Concepto</span>
                        <span class="data-value" id="val-concept">-</span>
                    </div>
                    <button type="button" class="copy-icon-btn" id="copy-concept-btn" aria-label="Copiar concepto" title="Copiar concepto">
                        <svg class="icon-copy" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <svg class="icon-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="button" class="primary-cta" id="primary-copy-btn">Copiar teléfono para Bizum</button>

            <div class="status-banner" id="status-banner" role="status" aria-live="polite"></div>
        </section>

        <section class="error-box" id="error-view">
            <div class="error-icon">!</div>
            <h1 class="error-title" id="error-title">Enlace de pago no válido</h1>
            <p class="error-desc" id="error-desc">
                Los datos del código QR Bizum están incompletos o no son válidos. Solicita al comercio que genere el QR de nuevo.
            </p>
        </section>
    </main>

    <script>
        (function () {
            'use strict';

            var I18N = Object.freeze({
                es: Object.freeze({
                    pageTitle: 'Pago por Bizum · Netto App®',
                    phoneLabel: 'Teléfono Bizum',
                    amountLabel: 'Importe',
                    conceptLabel: 'Concepto',
                    copyAmount: 'Copiar importe',
                    copyConcept: 'Copiar concepto',
                    primaryCta: 'Copiar teléfono para Bizum',
                    primaryCtaCopied: '✓ Teléfono Bizum copiado',
                    bannerTemplateWithConcept: 'Abre tu app del banco, pega el teléfono, introduce el importe y el concepto. Por último, comprueba con el comercio.',
                    bannerTemplate: 'Abre tu app del banco, pega el teléfono e introduce el importe. Por último, comprueba con el comercio.',
                    errorTitle: 'Enlace de pago no válido',
                    errorDesc: 'Los datos del código QR Bizum están incompletos o no son válidos. Solicita al comercio que genere el QR de nuevo.'
                }),
                en: Object.freeze({
                    pageTitle: 'Bizum Payment · Netto App®',
                    phoneLabel: 'Bizum Phone',
                    amountLabel: 'Amount',
                    conceptLabel: 'Concept',
                    copyAmount: 'Copy amount',
                    copyConcept: 'Copy concept',
                    primaryCta: 'Copy phone for Bizum',
                    primaryCtaCopied: '✓ Bizum phone copied',
                    bannerTemplateWithConcept: 'Open your banking app, paste the phone number, enter the amount and reference. Finally, check with the merchant.',
                    bannerTemplate: 'Open your banking app, paste the phone number and enter the amount. Finally, check with the merchant.',
                    errorTitle: 'Invalid payment link',
                    errorDesc: 'The Bizum QR code details are incomplete or invalid. Ask the merchant to generate the QR again.'
                })
            });

            function sanitizeText(raw, maxLen) {
                if (typeof raw !== 'string') return '';
                return raw
                    .replace(/[\r\n\x00-\x1F\x7F]+/g, ' ')
                    .replace(/\s{2,}/g, ' ')
                    .trim()
                    .slice(0, maxLen);
            }

            function normalizePhone(raw) {
                if (typeof raw !== 'string') return '';
                var digits = raw.replace(/\D/g, '');
                if (digits.indexOf('0034') === 0 && digits.length === 13) {
                    digits = digits.slice(4);
                } else if (digits.indexOf('34') === 0 && digits.length === 11) {
                    digits = digits.slice(2);
                }
                return digits;
            }

            function formatPhoneDisplay(digits) {
                return digits.slice(0, 3) + ' ' + digits.slice(3, 5) + ' ' + digits.slice(5, 7) + ' ' + digits.slice(7, 9);
            }

            function copySyncAndAsync(text) {
                try {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.top = '-9999px';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    ta.setSelectionRange(0, text.length);
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                } catch (_) {
                    // Fallback handled below
                }

                if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                    navigator.clipboard.writeText(text).catch(function () {});
                }
            }

            var params = new URLSearchParams(window.location.search);
            var rawPhone = params.get('t') || '';
            var rawAmount = params.get('a') || '';
            var rawConcept = params.get('c') || '';
            var rawMerchant = params.get('n') || '';

            var phone = normalizePhone(rawPhone);
            var isPhoneValid = /^[67]\d{8}$/.test(phone);

            var parsedAmount = Number(String(rawAmount).replace(',', '.'));
            var roundedAmount = Math.round(parsedAmount * 100) / 100;
            var isAmountValid = Number.isFinite(roundedAmount) && roundedAmount >= 0.01 && roundedAmount <= 999999.99;

            var merchant = sanitizeText(rawMerchant, 60) || 'Netto App®';
            var concept = sanitizeText(rawConcept, 70);

            var browserLang = (navigator.language || 'es').toLowerCase();
            var currentLang = browserLang.indexOf('es') === 0 ? 'es' : 'en';

            var btnLangEs = document.getElementById('btn-lang-es');
            var btnLangEn = document.getElementById('btn-lang-en');
            var paymentView = document.getElementById('payment-view');
            var errorView = document.getElementById('error-view');
            var primaryCopyBtn = document.getElementById('primary-copy-btn');
            var statusBanner = document.getElementById('status-banner');

            var formattedPhone = isPhoneValid ? formatPhoneDisplay(phone) : '';
            var amountComma = isAmountValid ? roundedAmount.toFixed(2).replace('.', ',') : '0,00';
            var amountDisplay = isAmountValid ? amountComma + ' €' : '0,00 €';

            function renderStrings() {
                var t = I18N[currentLang];
                document.documentElement.lang = currentLang;
                document.title = t.pageTitle;

                btnLangEs.className = 'lang-btn' + (currentLang === 'es' ? ' active' : '');
                btnLangEn.className = 'lang-btn' + (currentLang === 'en' ? ' active' : '');

                document.getElementById('lbl-phone').textContent = t.phoneLabel;
                document.getElementById('lbl-amount').textContent = t.amountLabel;
                document.getElementById('lbl-concept').textContent = t.conceptLabel;
                document.getElementById('copy-amount-btn').setAttribute('aria-label', t.copyAmount);
                document.getElementById('copy-amount-btn').setAttribute('title', t.copyAmount);
                document.getElementById('copy-concept-btn').setAttribute('aria-label', t.copyConcept);
                document.getElementById('copy-concept-btn').setAttribute('title', t.copyConcept);
                document.getElementById('error-title').textContent = t.errorTitle;
                document.getElementById('error-desc').textContent = t.errorDesc;

                if (primaryCopyBtn.className.indexOf('copied') !== -1) {
                    primaryCopyBtn.textContent = t.primaryCtaCopied;
                } else {
                    primaryCopyBtn.textContent = t.primaryCta;
                }

                if (statusBanner.className.indexOf('visible') !== -1) {
                    showStatusBanner();
                }
            }

            function showStatusBanner() {
                var t = I18N[currentLang];
                var bannerMsg = (concept && concept.length > 0)
                    ? t.bannerTemplateWithConcept
                    : t.bannerTemplate;
                statusBanner.textContent = bannerMsg;
                statusBanner.className = 'status-banner visible';
            }

            btnLangEs.addEventListener('click', function () {
                currentLang = 'es';
                renderStrings();
            });

            btnLangEn.addEventListener('click', function () {
                currentLang = 'en';
                renderStrings();
            });

            if (!isPhoneValid || !isAmountValid) {
                paymentView.className = 'hidden';
                errorView.style.display = 'block';
                renderStrings();
                return;
            }

            document.getElementById('merchant-name').textContent = merchant;
            document.getElementById('amount-hero').textContent = amountDisplay;
            document.getElementById('val-phone').textContent = '+34 ' + formattedPhone;
            document.getElementById('val-amount').textContent = amountDisplay;

            var conceptRow = document.getElementById('concept-row');
            if (concept.length > 0) {
                document.getElementById('val-concept').textContent = concept;
            } else {
                conceptRow.style.display = 'none';
            }

            function bindCopyButton(buttonId, valueToCopy) {
                var btn = document.getElementById(buttonId);
                btn.addEventListener('click', function () {
                    copySyncAndAsync(valueToCopy);
                    btn.className = 'copy-icon-btn copied';
                    setTimeout(function () {
                        btn.className = 'copy-icon-btn';
                    }, 1800);
                });
            }

            bindCopyButton('copy-amount-btn', amountComma);
            bindCopyButton('copy-concept-btn', concept);

            primaryCopyBtn.addEventListener('click', function () {
                copySyncAndAsync(phone);
                primaryCopyBtn.className = 'primary-cta copied';
                primaryCopyBtn.textContent = I18N[currentLang].primaryCtaCopied;
                showStatusBanner();
            });

            renderStrings();
        })();
    </script>
</body>
</html>
